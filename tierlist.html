<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken World Tier List</title>
<link rel="icon" href="assets/favicon.png">
<meta name="description" content="Rank chicken dishes from around the world from S to F and see how the group votes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
  :root { --t: 92px; --ink:#2a2018; --muted:#7a6a58; --line:#e3d8c4; --accent:#e4572e; --paper:#fffdf8;
          --ui:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Fraunces',Georgia,serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:#f6efe2; color:var(--ink); font:400 15px/1.4 var(--ui); }
  button, select, input { font: inherit; color: inherit; }


  header.top { max-width:none; margin:0 0 4px; padding:0; border-bottom:3px solid var(--ink); }
  .top-in { position:relative; max-width:1200px; margin:0 auto; padding:20px 16px; min-height:222px; display:flex; align-items:center; }
  .top-text { max-width:calc(100% - 430px - 28px); }
  .wire { position:absolute; right:16px; bottom:-1px; width:430px; height:auto; display:block; }
  @media (max-width:900px){ .top-in{ display:block; min-height:0; padding-bottom:0; text-align:center } .top-text{ max-width:none; padding-bottom:8px } .wire{ position:relative; right:auto; margin:10px auto 0; width:min(320px,76vw) } }
  h1 { margin:0; font:800 clamp(26px,4.5vw,38px)/1.05 var(--serif); letter-spacing:-.01em; }
  h1 span { color:var(--accent); }
  .sub { margin:6px 0 0; color:var(--muted); max-width:60ch; }

  .bar { max-width:1200px; margin:0 auto; padding:12px 16px 6px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  .bar select { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 34px 7px 14px; font-weight:600; max-width:100%;
                appearance:none; -webkit-appearance:none;
                background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%232a2018' stroke-width='2'/></svg>");
                background-repeat:no-repeat; background-position:right 13px center; }
  .count { color:var(--muted); font-size:14px; }
  .count b { color:var(--ink); }
  #status { color:var(--muted); font-size:13px; }
  .ghostbtn { border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); }
  .ghostbtn:hover { background:#fff; color:var(--ink); }
  .grow { flex:1; }
  .banner { max-width:1168px; margin:6px auto 4px; padding:9px 14px; background:#fff3cf; border:1px solid #ecd9a3; border-radius:10px; font-size:14px; }
  .banner button { margin-left:8px; }
  @media (min-width:1200px){ .banner{ margin-left:auto; margin-right:auto; } }
  @media (max-width:1200px){ .banner{ margin-left:16px; margin-right:16px; } }

  main { max-width:1200px; margin:0 auto; padding:6px 16px 28px; display:flex; flex-direction:column; gap:6px; }
  .tier { display:flex; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tier.over { outline:3px solid var(--accent); outline-offset:-3px; }
  .lab { flex:none; width:72px; display:grid; place-items:center; color:#fff; font:800 36px var(--serif); text-shadow:0 1px 0 rgba(0,0,0,.18); user-select:none; -webkit-user-select:none; }
  .items { flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:6px; padding:8px; align-content:flex-start; min-height:calc(var(--t) + 16px); }
  .tier .items:empty::before { content:"Drop dishes here"; align-self:center; padding-left:6px; color:rgba(42,32,24,.3); font-size:14px; }
  body.ro .tier .items:empty::before { content:"Nothing here"; }
  body:not(.ro) .tier { cursor:pointer; }

  .tile { position:relative; flex:none; width:var(--t); height:var(--t); border-radius:9px; overflow:hidden; background:#e5dccb;
          cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; box-shadow:0 1px 2px rgba(40,25,5,.3); outline:none; }
  .tile > img:not(.flg) { display:block; width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none; }
  .nm { position:absolute; left:0; right:0; bottom:0; padding:16px 4px 4px; background:linear-gradient(to bottom, transparent, rgba(24,14,6,.86));
        color:#fff; text-align:center; font:700 max(9px, calc(var(--t) * .115))/1.12 var(--ui); text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .nm span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .bdg { position:absolute; top:4px; left:4px; background:rgba(24,14,6,.8); color:#fff; border-radius:999px; font:700 10px/1 var(--ui); padding:3px 6px; }
  .bdg[hidden] { display:none; }
  .flg { position:absolute; top:4px; right:4px; width:max(18px, calc(var(--t) * .27)); height:max(18px, calc(var(--t) * .27)); border-radius:0; object-fit:cover;
         border:1.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.55); background:#fff; pointer-events:none; -webkit-user-drag:none; }
  .tile.dragging { opacity:.28; }
  .tile.sel { outline:3px solid var(--accent); outline-offset:1px; z-index:1; }
  .tile:focus-visible { outline:3px solid #2a6df4; outline-offset:1px; }
  body.ro .tile { cursor:default; }
  .ghost { position:fixed; left:0; top:0; z-index:1000; pointer-events:none; box-shadow:0 14px 30px rgba(0,0,0,.38); opacity:.96; will-change:transform; }
  body.dragging-now, body.dragging-now * { cursor:grabbing !important; }
  .marker { flex:none; width:5px; height:var(--t); border-radius:3px; background:var(--accent); margin:0 -2px; }

  #dock { position:fixed; right:16px; bottom:16px; width:min(460px, calc(100vw - 32px)); z-index:5; background:#fffaf0; border:2px solid var(--ink); border-radius:16px;
          box-shadow:0 10px 32px rgba(42,32,24,.3); max-height:min(62vh, 560px); overflow:auto; overscroll-behavior:contain; }
  body { padding-bottom:90px; }
  .logo-link { cursor:pointer; }
  .logo-link:hover image { opacity:.82; }
  .logo-link:hover polygon { fill:#fff3df; }
  .logo-link:focus-visible { outline:none; }
  .logo-link:focus-visible polygon { stroke:var(--accent); stroke-width:4; }
  #dock.over { outline:3px solid var(--accent); outline-offset:-3px; }
  body.ro #dock { display:none; }
  .dock-in { margin:0; }
  .dock-head { position:sticky; top:0; z-index:2; background:#fffaf0; padding:10px 14px 8px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; border-bottom:1px solid #eee3cf; }
  .dock-head h2 { margin:0; font:800 18px var(--serif); }
  .dock-head h2 small { font:600 13px var(--ui); color:var(--muted); margin-left:4px; }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:thin; max-width:100%; padding-bottom:2px; flex:1 1 280px; }
  .chips button { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chips button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .tools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tools input[type=search] { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; width:150px; font-size:13.5px; }
  .tools label { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .tools input[type=range] { width:84px; accent-color:var(--accent); }
  #hint { flex-basis:100%; font-size:13.5px; color:var(--accent); font-weight:600; min-height:0; }
  #hint:empty { display:none; }
  #pool { padding:10px 14px 14px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; min-height:calc(var(--t) + 24px); }
  #pool:empty::before { content:"Everything is ranked. Nice."; color:var(--muted); align-self:center; }
  #pool.nomatch::before { content:"No dishes match that filter."; color:var(--muted); }
  #nameWrap { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); }
  #nameWrap input { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; width:150px; font-size:13.5px; }
  #nameWrap .pri { background:var(--ink); color:#fff; border-color:var(--ink); }
  #nameWrap .pri:hover { background:#000; color:#fff; }
  #loading { padding:40px 16px; text-align:center; color:var(--muted); }

  @media (max-width:640px) {
    :root { --t: 76px; }
    .lab { width:52px; font-size:28px; }
    .tools input[type=search] { width:120px; }
    .tools input[type=range] { width:64px; }
    #dock { max-height:46vh; right:8px; bottom:8px; width:calc(100vw - 16px); }
  }
</style>
</head>
<body>

      <p class="sub">Drag each dish into a tier, from S (the best) down to F. Add your name to share your ranking, then flip to the group average to see what everyone thinks.</p>

</header>

<div class="bar">
  <select id="viewSel" aria-label="Whose ranking to show"></select>
  <span class="count" id="count"></span>
  <span id="status" role="status"></span>
  <span class="grow"></span>
  <span id="nameWrap"></span>
  <span id="clearWrap"><button class="ghostbtn" id="clearBtn" type="button">Start over</button></span>
</div>
<div class="banner" id="banner" hidden></div>

<main id="tiers"><div id="loading">Loading dishes…</div></main>

<section id="dock" aria-label="Unranked dishes">
  <div class="dock-in">
    <div class="dock-head">
      <h2>Unranked <small id="poolCount"></small></h2>
      <div class="chips" id="chips"></div>
      <div class="tools">
        <input type="search" id="q" placeholder="Search dishes" aria-label="Search dishes">
        <label><input type="checkbox" id="cooked"> Cooked only</label>
        <label>Size <input type="range" id="size" min="60" max="140" step="2" value="92" aria-label="Tile size"></label>
      </div>
      <div id="hint" aria-live="polite"></div>
    </div>
    <div id="pool"></div>
  </div>
</section>

<script>
(function () {
  "use strict";

  var TIERS = [
    { k: "S", c: "#ec5a5a" }, { k: "A", c: "#f2993f" }, { k: "B", c: "#efc43f" },
    { k: "C", c: "#86c957" }, { k: "D", c: "#47aec6" }, { k: "F", c: "#9783d6" }
  ];
  var KEYS = TIERS.map(function (t) { return t.k; });
  var SCORE = { S: 6, A: 5, B: 4, C: 3, D: 2, F: 1 };
  var LS_KEY = "chickenworld-tierlist-v1";

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function emptyTiers() { return { S: [], A: [], B: [], C: [], D: [], F: [] }; }

  var DISHES = [], BYID = new Map(), tileEls = new Map(), rows = {};
  var mine = emptyTiers(), mineUpdated = 0;
  var view = "me";                 // "me" | "group" | <uid>
  var lists = new Map();           // uid -> { tiers, updatedAt }
  var names = {};                  // uid -> display name
  var region = "All", query = "", selected = null, cookedOnly = false;
  var db = null, userCap = null, uid = null, remoteBlocked = false, remoteChecked = false;
  var saveTimer = null, saving = false, again = false;
  var drag = null, pend = null, pendingRender = false, justDragged = false;

  /* ---------- helpers on tier data ---------- */
  function sanitize(t) {
    var out = emptyTiers(), seen = new Set();
    if (!t || typeof t !== "object") return out;
    KEYS.forEach(function (k) {
      (Array.isArray(t[k]) ? t[k] : []).forEach(function (id) {
        if (BYID.has(id) && !seen.has(id)) { seen.add(id); out[k].push(id); }
      });
    });
    return out;
  }
  function countRanked(t) { return KEYS.reduce(function (n, k) { return n + t[k].length; }, 0); }

  function groupData() {
    var sum = {}, cnt = {}, people = 0;
    var all = [];
    lists.forEach(function (v, u) { if (u !== uid) all.push(sanitize(v.tiers)); });
    all.push(mine);
    all.forEach(function (t) {
      if (!countRanked(t)) return;
      people++;
      KEYS.forEach(function (k) { t[k].forEach(function (id) { sum[id] = (sum[id] || 0) + SCORE[k]; cnt[id] = (cnt[id] || 0) + 1; }); });
    });
    var tiers = emptyTiers(), stats = {};
    Object.keys(sum).forEach(function (id) {
      var avg = sum[id] / cnt[id];
      stats[id] = { avg: avg, n: cnt[id] };
      var k = avg >= 5.5 ? "S" : avg >= 4.5 ? "A" : avg >= 3.5 ? "B" : avg >= 2.5 ? "C" : avg >= 1.5 ? "D" : "F";
      tiers[k].push(id);
    });
    KEYS.forEach(function (k) {
      tiers[k].sort(function (a, b) {
        return stats[b].avg - stats[a].avg || stats[b].n - stats[a].n || BYID.get(a).name.localeCompare(BYID.get(b).name);
      });
    });
    return { tiers: tiers, stats: stats, people: people };
  }

  function placement() {
    if (view === "me") return { tiers: mine };
    if (view === "group") return groupData();
    var v = lists.get(view);
    return { tiers: sanitize(v && v.tiers) };
  }

  /* ---------- building the page ---------- */
  function buildTile(d) {
    var t = el("div", "tile");
    t.dataset.id = d.id;
    t.tabIndex = 0;
    t.setAttribute("role", "button");
    t.title = d.country + " — " + d.name;
    t.setAttribute("aria-label", d.name + ", " + d.country);
    var img = document.createElement("img");
    img.src = d.img; img.alt = ""; img.draggable = false; img.decoding = "async";
    t.appendChild(img);
    if (d.photo && d.flag) {
      var fl = document.createElement("img");
      fl.className = "flg"; fl.src = d.flag; fl.alt = ""; fl.draggable = false;
      t.appendChild(fl);
    }
    var nm = el("div", "nm"); nm.appendChild(el("span", null, d.name)); t.appendChild(nm);
    var b = el("span", "bdg"); b.hidden = true; t.appendChild(b); t._b = b;
    t.addEventListener("contextmenu", function (e) { if (view === "me") e.preventDefault(); });
    return t;
  }

  function buildRows() {
    var main = $("#tiers"); main.textContent = "";
    TIERS.forEach(function (T) {
      var sec = el("section", "tier"); sec.dataset.k = T.k;
      var lab = el("div", "lab"); lab.style.background = T.c; lab.appendChild(el("span", null, T.k));
      lab.setAttribute("aria-label", "Tier " + T.k);
      var items = el("div", "items");
      sec.appendChild(lab); sec.appendChild(items); main.appendChild(sec);
      rows[T.k] = items;
    });
  }

  function buildChips() {
    var regions = ["All"];
    DISHES.forEach(function (d) { if (regions.indexOf(d.region) < 0) regions.push(d.region); });
    var box = $("#chips"); box.textContent = "";
    regions.forEach(function (r) {
      var b = el("button", r === region ? "on" : "", r); b.type = "button";
      b.addEventListener("click", function () {
        region = r;
        Array.prototype.forEach.call(box.children, function (c) { c.classList.toggle("on", c === b); });
        render();
      });
      box.appendChild(b);
    });
  }

  /* ---------- render ---------- */
  function render() {
    if (drag) { pendingRender = true; return; }
    pendingRender = false;
    var ro = view !== "me";
    document.body.classList.toggle("ro", ro);
    var pl = placement(), placed = new Set();
    tileEls.forEach(function (t) { t._b.hidden = true; });
    KEYS.forEach(function (k) {
      rows[k].replaceChildren.apply(rows[k], pl.tiers[k].map(function (id) {
        placed.add(id);
        var t = tileEls.get(id);
        if (view === "group" && pl.stats && pl.stats[id]) {
          t._b.textContent = pl.stats[id].avg.toFixed(1);
          t._b.hidden = false;
          t.title = BYID.get(id).country + " — " + BYID.get(id).name + " (avg " + pl.stats[id].avg.toFixed(1) + " from " + pl.stats[id].n + (pl.stats[id].n === 1 ? " person)" : " people)");
        } else {
          t.title = BYID.get(id).country + " — " + BYID.get(id).name;
        }
        return t;
      }));
    });
    tileEls.forEach(function (t, id) {
      t.classList.toggle("sel", !ro && id === selected);
      if (!(view === "group" && placed.has(id))) t.title = BYID.get(id).country + " — " + BYID.get(id).name;
    });

    var pool = $("#pool");
    if (!ro) {
      var q = norm(query).trim(), list = [];
      DISHES.forEach(function (d) {
        if (placed.has(d.id)) return;
        if (region !== "All" && d.region !== region) return;
        if (cookedOnly && !d.photo) return;
        if (q && d._q.indexOf(q) < 0) return;
        list.push(tileEls.get(d.id));
      });
      pool.replaceChildren.apply(pool, list);
      pool.classList.toggle("nomatch", !list.length && (DISHES.length - placed.size) > 0);
      $("#poolCount").textContent = (DISHES.length - placed.size) + " left";
    }
    updateBar(pl);
    updateHint();
  }

  function updateBar(pl) {
    var cnt = $("#count"), banner = $("#banner"), clr = $("#clearWrap");
    clr.style.display = view === "me" ? "" : "none";
    banner.hidden = view === "me";
    if (view === "me") {
      cnt.textContent = ""; var b = el("b", null, String(countRanked(mine)));
      cnt.appendChild(b); cnt.appendChild(document.createTextNode(" of " + DISHES.length + " dishes ranked"));
    } else if (view === "group") {
      cnt.textContent = Object.keys(pl.stats).length + " of " + DISHES.length + " dishes ranked by someone";
      setBanner("Group average from " + pl.people + (pl.people === 1 ? " person" : " people") + ". Tiers come from everyone’s average score (S = 6 down to F = 1), and the badge on each tile is that average.");
    } else {
      cnt.textContent = countRanked(pl.tiers) + " of " + DISHES.length + " dishes ranked";
      setBanner("Viewing " + (names[view] || "a friend") + "’s ranking (read-only).");
    }
  }
  function setBanner(text) {
    var b = $("#banner"); b.textContent = text + " ";
    var btn = el("button", "ghostbtn", "Back to my ranking"); btn.type = "button";
    btn.addEventListener("click", function () { setView("me"); });
    b.appendChild(btn);
  }
  function updateHint() {
    var h = $("#hint");
    if (selected && view === "me") h.textContent = "Selected: " + BYID.get(selected).name + ". Tap a tier to place it, tap here to unrank, or press S A B C D F.";
    else h.textContent = "";
  }

  /* ---------- view selector ---------- */
  function rebuildViewSel() {
    var sel = $("#viewSel"), cur = view;
    sel.textContent = "";
    var o1 = el("option", null, "My ranking"); o1.value = "me"; sel.appendChild(o1);
    var people = groupData().people;
    var o2 = el("option", null, "Group average (" + people + (people === 1 ? " person)" : " people)")); o2.value = "group"; sel.appendChild(o2);
    var n = 0;
    lists.forEach(function (v, u) {
      if (u === uid) return;
      var t = sanitize(v.tiers); if (!countRanked(t)) return;
      n++;
      var o = el("option", null, (names[u] || "Friend " + n) + "’s ranking"); o.value = u; sel.appendChild(o);
    });
    if (cur !== "me" && cur !== "group" && !lists.has(cur)) cur = "me";
    view = cur; sel.value = cur;
  }
  function setView(v) { view = v; selected = null; $("#viewSel").value = v; render(); }

  async function refreshNames() {
    if (!userCap || !userCap.profiles) return;
    var ids = []; lists.forEach(function (v, u) { ids.push(u); });
    if (uid && ids.indexOf(uid) < 0) ids.push(uid);
    if (!ids.length) return;
    try {
      var ps = await userCap.profiles(ids);
      ids.forEach(function (u) { names[u] = (ps && ps[u] && ps[u].name) || ""; });
    } catch (e) { /* names are optional */ }
    rebuildViewSel(); render();
  }

  /* ---------- saving ---------- */
  function setStatus(t) { $("#status").textContent = t; }
  function scheduleSave() {
    mineUpdated = Date.now();
    setStatus("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
  }
  async function flush() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ tiers: mine, updatedAt: mineUpdated })); } catch (e) { /* storage can be unavailable */ }
    if (!myName) { setStatus("Saved on this device. Add your name to share it with friends."); return; }
    if (saving) { again = true; return; }
    saving = true;
    try {
      var res = await rpc("save_ranking", { p_name: myName, p_token: token, p_placements: { tiers: mine, updatedAt: mineUpdated } });
      if (res === "ok") { setStatus("Saved and shared ✓"); fetchLists(); }
      else if (res === "name_taken") { setStatus("The name “" + myName + "” is already taken by someone else. Pick a different one."); forgetName(); }
      else setStatus("Saved on this device. Couldn’t share it (" + res + ").");
    } catch (e) {
      setStatus("Saved on this device. Couldn’t reach the shared list just now.");
    }
    saving = false;
    if (again) { again = false; flush(); }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var o = JSON.parse(raw); mine = sanitize(o.tiers); mineUpdated = +o.updatedAt || 0; }
    } catch (e) { /* ignore */ }
  }

  /* ---------- drag and drop ---------- */
  var marker = el("div", "marker");

  function tileFrom(e) { return e.target && e.target.closest ? e.target.closest(".tile") : null; }

  document.addEventListener("pointerdown", function (e) {
    if (view !== "me" || drag) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    var t = tileFrom(e); if (!t) return;
    cancelPend();
    var r = t.getBoundingClientRect();
    pend = { id: t.dataset.id, el: t, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, pid: e.pointerId, type: e.pointerType,
             ox: e.clientX - r.left, oy: e.clientY - r.top, timer: null };
    if (e.pointerType !== "mouse") {
      pend.timer = setTimeout(function () { if (pend) startDrag(pend.lx, pend.ly); }, 220);
    }
  });

  window.addEventListener("pointermove", function (e) {
    if (drag) {
      if (e.pointerId !== drag.pid) return;
      moveDrag(e.clientX, e.clientY);
      return;
    }
    if (!pend || e.pointerId !== pend.pid) return;
    pend.lx = e.clientX; pend.ly = e.clientY;
    var dist = Math.hypot(e.clientX - pend.x, e.clientY - pend.y);
    if (pend.type === "mouse") { if (dist > 4) startDrag(e.clientX, e.clientY); }
    else if (dist > 9) cancelPend();   // the finger is scrolling
  });

  window.addEventListener("pointerup", function (e) {
    if (drag && e.pointerId === drag.pid) { moveDrag(e.clientX, e.clientY); endDrag(true); return; }
    if (pend && e.pointerId === pend.pid) {
      var id = pend.id; cancelPend();
      selected = (selected === id) ? null : id;   // a plain tap selects
      render();
    }
  });
  window.addEventListener("pointercancel", function (e) {
    if (drag && e.pointerId === drag.pid) endDrag(false);
    else if (pend && e.pointerId === pend.pid) cancelPend();
  });
  window.addEventListener("blur", function () { if (drag) endDrag(false); });

  function cancelPend() { if (pend && pend.timer) clearTimeout(pend.timer); pend = null; }

  function stopTouchScroll(e) { if (e.cancelable) e.preventDefault(); }

  function startDrag(x, y) {
    if (!pend) return;
    var p = pend; cancelPend();
    var rect = p.el.getBoundingClientRect();
    var ghost = p.el.cloneNode(true);
    ghost.classList.remove("dragging", "sel"); ghost.classList.add("ghost");
    ghost.removeAttribute("tabindex"); ghost.removeAttribute("title");
    ghost.style.width = rect.width + "px"; ghost.style.height = rect.height + "px";
    document.body.appendChild(ghost);
    drag = { id: p.id, el: p.el, pid: p.pid, ghost: ghost, ox: p.ox, oy: p.oy, x: x, y: y, target: null, raf: 0 };
    p.el.classList.add("dragging");
    document.body.classList.add("dragging-now");
    document.addEventListener("touchmove", stopTouchScroll, { passive: false });
    moveDrag(x, y);
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.transform = "translate(" + (x - drag.ox) + "px," + (y - drag.oy) + "px) scale(1.06)";
    drag.target = findTarget(x, y);
    showTarget(drag.target);
  }

  function findTarget(x, y) {
    var hit = document.elementFromPoint(x, y);
    var zone = hit && hit.closest ? hit.closest(".tier, #dock") : null;
    if (!zone) return null;
    if (zone.id === "dock") return { type: "dock", zone: zone };
    var k = zone.dataset.k, items = rows[k];
    return { type: "tier", k: k, zone: zone, items: items, idx: indexAt(items, x, y, drag.el) };
  }

  function indexAt(items, x, y, skip) {
    var kids = Array.prototype.filter.call(items.children, function (c) { return c.classList.contains("tile") && c !== skip; });
    for (var i = 0; i < kids.length; i++) {
      var r = kids[i].getBoundingClientRect();
      if (y < r.top) return i;
      if (y <= r.bottom && x < r.left + r.width / 2) return i;
    }
    return kids.length;
  }

  function showTarget(t) {
    Array.prototype.forEach.call(document.querySelectorAll(".over"), function (n) { n.classList.remove("over"); });
    if (!t) { if (marker.parentNode) marker.remove(); return; }
    t.zone.classList.add("over");
    if (t.type === "tier") {
      var kids = Array.prototype.filter.call(t.items.children, function (c) { return c.classList.contains("tile") && c !== drag.el; });
      var before = kids[t.idx] || null;
      if (marker.parentNode !== t.items || marker.nextSibling !== before) t.items.insertBefore(marker, before);
    } else if (marker.parentNode) marker.remove();
  }

  function endDrag(commit) {
    var d = drag; if (!d) return;
    cancelAnimationFrame(d.raf);
    document.removeEventListener("touchmove", stopTouchScroll, { passive: false });
    document.body.classList.remove("dragging-now");
    d.ghost.remove(); d.el.classList.remove("dragging");
    if (marker.parentNode) marker.remove();
    Array.prototype.forEach.call(document.querySelectorAll(".over"), function (n) { n.classList.remove("over"); });
    drag = null;
    justDragged = true; setTimeout(function () { justDragged = false; }, 60);
    if (commit && d.target) place(d.id, d.target.type === "tier" ? d.target.k : null, d.target.type === "tier" ? d.target.idx : 0);
    else if (pendingRender) render();
  }

  function autoScroll() {
    if (!drag) return;
    var y = drag.y, vh = window.innerHeight, dy = 0;
    if (y < 60) dy = -Math.ceil((60 - y) / 8);
    else if (y > vh - 50) dy = Math.ceil((y - (vh - 50)) / 8);
    if (dy) { window.scrollBy(0, dy); drag.target = findTarget(drag.x, drag.y); showTarget(drag.target); }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  /* move a dish to tier k at position idx (k = null puts it back in the pool) */
  function place(id, k, idx) {
    KEYS.forEach(function (key) { var i = mine[key].indexOf(id); if (i >= 0) mine[key].splice(i, 1); });
    if (k) { var arr = mine[k]; arr.splice(idx == null ? arr.length : Math.min(idx, arr.length), 0, id); }
    selected = null;
    scheduleSave();
    render();
  }

  /* tap-to-place: pick a dish, then tap a tier (or the unranked tray) */
  document.addEventListener("click", function (e) {
    if (justDragged || view !== "me" || !selected) return;
    if (e.target.closest && e.target.closest(".tile")) return;
    if (e.target.closest && e.target.closest("#dock .dock-head .chips, #dock .tools, #dock .dock-head h2")) return;
    var tier = e.target.closest ? e.target.closest(".tier") : null;
    if (tier) { place(selected, tier.dataset.k, null); return; }
    if (e.target.closest && e.target.closest("#dock")) place(selected, null);
  });

  document.addEventListener("keydown", function (e) {
    if (view !== "me") return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    var tile = e.target.closest ? e.target.closest(".tile") : null;
    if (tile && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault(); var id = tile.dataset.id; selected = selected === id ? null : id; render();
      var again = tileEls.get(id); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (!selected) return;
    var key = e.key.toUpperCase();
    if (KEYS.indexOf(key) >= 0) { e.preventDefault(); var sid = selected; place(sid, key, null); var t2 = tileEls.get(sid); if (t2) t2.focus({ preventScroll: true }); }
    else if (e.key === "u" || e.key === "U" || e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); place(selected, null); }
    else if (e.key === "Escape") { selected = null; render(); }
  });

  /* ---------- controls ---------- */
  $("#viewSel").addEventListener("change", function (e) { setView(e.target.value); });
  $("#q").addEventListener("input", function (e) { query = e.target.value; render(); });
  $("#cooked").addEventListener("change", function (e) { cookedOnly = e.target.checked; render(); });
  $("#size").addEventListener("input", function (e) {
    document.documentElement.style.setProperty("--t", e.target.value + "px");
    try { localStorage.setItem(LS_KEY + "-size", e.target.value); } catch (x) { /* ignore */ }
  });
  function resetClear() {
    var wrap = $("#clearWrap"); wrap.textContent = "";
    var b = el("button", "ghostbtn", "Start over"); b.id = "clearBtn"; b.type = "button";
    wrap.appendChild(b);
    bindClear(b);
  }
  function bindClear(b) {
    b.addEventListener("click", function () {
      var wrap = $("#clearWrap"); wrap.textContent = "";
      wrap.appendChild(document.createTextNode("Move everything back? "));
      var y = el("button", "ghostbtn", "Yes, start over"), n = el("button", "ghostbtn", "Cancel");
      y.type = n.type = "button";
      y.addEventListener("click", function () { mine = emptyTiers(); selected = null; scheduleSave(); resetClear(); render(); });
      n.addEventListener("click", resetClear);
      wrap.appendChild(y); wrap.appendChild(n);
    });
  }

  /* ---------- shared rankings (Supabase) ---------- */
  var SB_URL = "https://eurrqkuuwhxdedjskhjv.supabase.co";
  var SB_KEY = "sb_publishable_zzEn1DITEaxG5Wzb3LCiSw_DWNFsoz_";   // publishable key: safe in a public page
  var myName = "", token = "";

  function sbHeaders() { return { apikey: SB_KEY, "Content-Type": "application/json" }; }
  async function rpc(fn, body) {
    var r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: sbHeaders(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error("rpc " + r.status);
    return r.json();
  }
  async function fetchLists() {
    try {
      var r = await fetch(SB_URL + "/rest/v1/rankings?select=name,placements,updated_at", { headers: sbHeaders() });
      if (!r.ok) throw new Error(String(r.status));
      var rows = await r.json(), next = new Map();
      rows.forEach(function (row) {
        var p = row.placements || {};
        next.set(row.name, { tiers: p.tiers || {}, updatedAt: +p.updatedAt || 0 });
        names[row.name] = row.name;
      });
      lists = next;
      if (!drag) { rebuildViewSel(); render(); }
    } catch (e) { /* offline: keep what we have */ }
  }

  function loadIdentity() {
    try {
      myName = localStorage.getItem(LS_KEY + "-name") || "";
      token = localStorage.getItem(LS_KEY + "-token") || "";
      if (!token) {
        var a = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(a);
        token = Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
        localStorage.setItem(LS_KEY + "-token", token);
      }
    } catch (e) { if (!token) token = String(Math.random()).slice(2) + String(Date.now()); }
    uid = myName || null;
  }
  function forgetName() {
    myName = ""; uid = null;
    try { localStorage.removeItem(LS_KEY + "-name"); } catch (e) { /* ignore */ }
    renderName(); rebuildViewSel(); render();
  }
  function renderName() {
    var w = $("#nameWrap"); w.textContent = "";
    if (myName) {
      w.appendChild(document.createTextNode("Sharing as "));
      w.appendChild(el("b", null, myName));
      var ch = el("button", "ghostbtn", "Change name"); ch.type = "button";
      ch.addEventListener("click", function () { forgetName(); var i = $("#nameIn"); if (i) i.focus(); });
      w.appendChild(ch);
    } else {
      var inp = document.createElement("input");
      inp.id = "nameIn"; inp.type = "text"; inp.maxLength = 40; inp.placeholder = "Your name"; inp.setAttribute("aria-label", "Your name");
      var btn = el("button", "ghostbtn pri", "Share my ranking"); btn.type = "button";
      function go() {
        var n = inp.value.trim().replace(/\s+/g, " ");
        if (!n) { inp.focus(); return; }
        myName = n; uid = n;
        try { localStorage.setItem(LS_KEY + "-name", n); } catch (e) { /* ignore */ }
        renderName(); rebuildViewSel(); render();
        mineUpdated = mineUpdated || Date.now();
        flush();
      }
      btn.addEventListener("click", go);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      w.appendChild(inp); w.appendChild(btn);
    }
  }

  function initShared() {
    loadIdentity(); renderName();
    fetchLists().then(function () { if (myName && mineUpdated) flush(); });
    setInterval(function () { if (!document.hidden) fetchLists(); }, 30000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) fetchLists(); });
  }

  /* ---------- start ---------- */
  async function init() {
    try { var s = localStorage.getItem(LS_KEY + "-size"); if (s) { $("#size").value = s; document.documentElement.style.setProperty("--t", s + "px"); } } catch (e) { /* ignore */ }
    var res = await fetch("dishes.json");
    if (!res.ok) throw new Error("dishes.json " + res.status);
    DISHES = await res.json();
    DISHES.forEach(function (d) { d._q = norm(d.name + " " + d.country + " " + d.region); BYID.set(d.id, d); tileEls.set(d.id, buildTile(d)); });
    buildRows(); buildChips(); loadLocal(); mine = sanitize(mine);
    bindClear($("#clearBtn"));
    initShared();
    rebuildViewSel(); render();
  }
  init().catch(function (e) {
    var m = $("#tiers"); m.textContent = ""; m.appendChild(el("div", null, "Couldn’t load the dishes. Try reloading the page."));
    if (window.console) console.error(e);
  });
})();
</script>
